  <style>
    :root {
      color-scheme: light dark;
      --dad-desk: #fff5df;
      --dad-card: #fffdf8;
      --dad-ink: #234839;
      --dad-edge: #9c8672;
    }
    /* egui-web's hidden text-input element (the keyboard/IME bridge) sits at the text caret, 1px
       wide, and shows a sliver of the last typed character there; keep its text invisible */
    body > input { color: transparent !important; background: transparent !important; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: var(--dad-desk);
      color: var(--dad-ink);
      font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --dad-desk: #211c18;
        --dad-card: #2b2520;
        --dad-ink: #fff5df;
        --dad-edge: #85725f;
      }
    }
    #vershion_canvas { display: block; width: 100vw; height: 100vh; }
    #vershion_loading {
      position: fixed; inset: 0; z-index: 2;
      display: grid; place-items: center; text-align: center;
      background: inherit; transition: opacity .35s ease;
    }
    #vershion_loading img {
      width: min(88vw, 390px); height: auto;
      max-height: 60vh;
    }
    #vershion_loading p { margin: 12px 24px; max-width: 46ch; line-height: 1.45; }
  </style>
  <!-- Umami (self-hosted, cookieless) visit counts; counts only on the live host. -->
  <script defer src="https://dash.rashio.app/insight.js" data-website-id="12bebe62-f0c0-4d2e-8cee-8d1119f56554" data-domains="vershion.lefthanddev.com"></script>

<body>
  <div id="vershion_loading">
    <div>
      <img src="dad-logo.svg" alt="Loading D.A.D · Dynamic Assessment Developer" />
      <noscript><p>D.A.D needs JavaScript and WebGL2.</p></noscript>
    </div>
  </div>
  <canvas id="vershion_canvas"></canvas>
  <link data-trunk rel="rust" data-bin="vershion-web" data-wasm-opt="z"
        data-wasm-opt-params="--enable-bulk-memory-opt --enable-nontrapping-float-to-int"
        data-weak-refs />
</body>
