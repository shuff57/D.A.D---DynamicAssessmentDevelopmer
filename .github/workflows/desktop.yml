# Portable desktop packages (tools/package.sh): Linux, and macOS (Apple Silicon and Intel).
# Run by hand (Actions > Desktop packages > Run workflow), by pushing a v* tag (which also attaches
# the packages to a draft GitHub release), or by changing the packaging on dad/engine.
#
# History: while this repo was private, macOS minutes billed at 10x and the old matrix (with the
# ~5x slower macos-15-intel runner) used ~2,400 of the account's 2,000 included minutes in Nov 2026.
# The repo is public now, so runner minutes are free, but:
#   - Linux runs on every trigger (it's what catches packaging breakage).
#   - macOS runs only for v* tags, or a manual run with "macos" ticked. Branch pushes skip it.
#   - Both macOS targets build in parallel on Apple Silicon runners; x86_64 is cross-compiled
#     (package.sh already takes the triple), never on the slow Intel runner.
name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build the macOS packages (10x billed minutes)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
    # Also when the packaging itself changes on the D.A.D branch (manual runs need the workflow on
    # the default branch, which is still verSHion's).
    branches: [dad/engine]
    paths: [tools/package.sh, .github/workflows/desktop.yml, engine/browser/checker-files.sh]

permissions:
  contents: write

# The D.A.D server these packages talk to (D.A.D AI credits, sharing) and where its legal pages
# live, from the repository's Actions variables (Settings > Secrets and variables > Actions >
# Variables). Unset or empty, the packages are built without a server, as before; build.rs refuses
# an address that isn't https.
env:
  VERSHION_POOL_URL: ${{ vars.VERSHION_POOL_URL }}
  VERSHION_LEGAL_URL: ${{ vars.VERSHION_LEGAL_URL }}

# A newer push to the same branch cancels the older run. Tags each get their own group.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu
      - name: Linux build libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev libx11-dev mold
        # mold: .cargo/config.toml links Linux x86_64 with it
      - name: Package
        run: tools/package.sh x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: DAD-x86_64-unknown-linux-gnu
          path: dist/desktop/*.tar.gz
          if-no-files-found: error
      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/desktop/*.tar.gz

  macos:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.macos)
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest   # Apple Silicon for both; the Intel package is cross-compiled
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-on-arm64
      - name: Package
        run: tools/package.sh ${{ matrix.target }}
      - name: Smoke-test the macOS archive in portable mode
        run: |
          # The x86_64 app can only launch under Rosetta; if the runner image lacks it, the
          # archive still gets its signature verified but is not launched.
          sandbox=$(mktemp -d)
          ditto -x -k dist/desktop/*.zip "$sandbox"
          apps=("$sandbox"/*/DAD.app)
          app="${apps[0]}"
          app_dir=$(dirname "$app")
          codesign --verify --deep --strict "$app"
          if [[ "${{ matrix.target }}" == x86_64-* ]] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "no Rosetta on this runner: skipping launch of the Intel build"; exit 0
          fi
          touch "$app_dir/portable"
          XDG_DATA_HOME="$sandbox/data" VERSHION_SEED=1 "$app/Contents/MacOS/DAD"
          test -s "$app_dir/DAD-data/banks.json"
      - uses: actions/upload-artifact@v4
        with:
          name: DAD-${{ matrix.target }}
          path: dist/desktop/*.zip
          if-no-files-found: error
      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/desktop/*.zip
