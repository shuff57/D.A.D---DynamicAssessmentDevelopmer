# Portable desktop packages (tools/package.sh): Linux, and macOS (Apple Silicon and Intel).
# Run by hand (Actions > Desktop packages > Run workflow), by pushing a v* tag (which also attaches
# the packages to a draft GitHub release), or by changing the packaging on dad/engine.
#
# Cost: this repo is private, and GitHub bills macOS minutes at 10x Linux. The old 3-runner matrix
# (Linux + macos-latest + macos-15-intel, ~36 min on the Intel runner alone) used ~2,400 of the
# account's 2,000 included minutes in Nov 2026. So:
#   - Linux runs on every trigger (cheap, and it's what catches packaging breakage).
#   - macOS runs only for v* tags, or a manual run with "macos" ticked. Branch pushes skip it.
#   - Both macOS targets build on ONE Apple Silicon runner; x86_64 is cross-compiled
#     (package.sh already takes the triple). The Intel runner was ~5x slower than Apple Silicon.
name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build the macOS packages (10x billed minutes)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
    # Also when the packaging itself changes on the D.A.D branch (manual runs need the workflow on
    # the default branch, which is still verSHion's).
    branches: [dad/engine]
    paths: [tools/package.sh, .github/workflows/desktop.yml, engine/browser/checker-files.sh]

permissions:
  contents: write

# A newer push to the same branch cancels the older run. Tags each get their own group.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu
      - name: Linux build libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev libx11-dev mold
        # mold: .cargo/config.toml links Linux x86_64 with it
      - name: Package
        run: tools/package.sh x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: DAD-x86_64-unknown-linux-gnu
          path: dist/desktop/*.tar.gz
          if-no-files-found: error
      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/desktop/*.tar.gz

  macos:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-latest   # Apple Silicon
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
      - name: Package (Apple Silicon)
        run: tools/package.sh aarch64-apple-darwin
      - name: Package (Intel, cross-compiled)
        run: tools/package.sh x86_64-apple-darwin
      - name: Smoke-test the macOS archives in portable mode
        run: |
          # The x86_64 app can only launch under Rosetta; if the runner image lacks it, that
          # archive still gets its signature verified but is not launched.
          rosetta=0; arch -x86_64 /usr/bin/true 2>/dev/null && rosetta=1
          for zip in dist/desktop/*.zip; do
            echo "== $zip"
            sandbox=$(mktemp -d)
            ditto -x -k "$zip" "$sandbox"
            apps=("$sandbox"/*/DAD.app)
            app="${apps[0]}"
            app_dir=$(dirname "$app")
            codesign --verify --deep --strict "$app"
            if [[ "$zip" == *x86_64* && $rosetta == 0 ]]; then
              echo "no Rosetta on this runner: skipping launch of the Intel build"; continue
            fi
            touch "$app_dir/portable"
            XDG_DATA_HOME="$sandbox/data" VERSHION_SEED=1 "$app/Contents/MacOS/DAD"
            test -s "$app_dir/DAD-data/banks.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: DAD-macos
          path: dist/desktop/*.zip
          if-no-files-found: error
      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/desktop/*.zip
