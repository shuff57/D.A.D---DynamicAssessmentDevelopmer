# Portable desktop packages (tools/package.sh): Linux first, macOS (Apple Silicon and Intel).
# Run by hand (Actions > Desktop packages > Run workflow), by pushing a v* tag (which also attaches
# the packages to a draft GitHub release), or by changing the packaging on dad/engine.
name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Also when the packaging itself changes on the D.A.D branch (manual runs need the workflow on
    # the default branch, which is still verSHion's).
    branches: [dad/engine]
    paths: [tools/package.sh, .github/workflows/desktop.yml, engine/browser/checker-files.sh]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev libx11-dev
      - name: Package
        run: tools/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: DAD-${{ matrix.target }}
          path: |
            dist/desktop/*.tar.gz
            dist/desktop/*.zip
          if-no-files-found: error
      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/desktop/*.tar.gz
            dist/desktop/*.zip
